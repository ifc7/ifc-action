name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The action runs its scripts directly, so a script committed without the executable bit fails
      # on every runner even though the tests (which call them through bash) pass.
      - name: Scripts are executable
        run: |
          bad=$(git ls-files -s -- 'scripts/*.sh' 'test/*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "::error::not executable in git: $bad (run: git update-index --chmod=+x <file>)"
            exit 1
          fi

      - name: shellcheck
        run: shellcheck scripts/*.sh test/*.sh

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: Test push
        run: bash test/push_test.sh

      - name: Test lint
        run: bash test/lint_test.sh

      - name: Test install
        run: bash test/install_test.sh
